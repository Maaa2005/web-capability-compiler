[project]
name = "wcc"
version = "0.1.0.dev0"
description = "Compile existing websites into reusable, typed capabilities for MCP agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.2",
    "playwright>=1.62.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Phase 6 only. The core pipeline never calls a model, so this stays out of the
# default install rather than being pulled in for everyone who wanted a compiler.
llm = ["anthropic>=0.69"]

[project.scripts]
wcc = "wcc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcc"]

[dependency-groups]
dev = [
    # The optional extra, installed for development so the provider is type-checked
    # and its construction is testable. It stays out of the runtime dependencies.
    "anthropic>=0.69",
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
