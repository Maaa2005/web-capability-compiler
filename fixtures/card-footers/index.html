<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture: Card Footers</title></head>
<body>
  <!-- Cards built from divs, each ending in its own footer, with no main
       landmark and no page footer. Every card footer sits directly under body
       divs, so each looks like a footer of the page; the last one is the
       boundary, and everything in the cards comes before it. -->
  <div class="grid">
    <div class="card">
      <h3><a href="/p/1/">Trail Shoe</a></h3>
      <p>Light and grippy.</p>
      <footer><span>$120</span></footer>
    </div>
    <div class="card">
      <h3><a href="/p/2/">Road Shoe</a></h3>
      <p>Cushioned for distance.</p>
      <footer><span>$140</span></footer>
    </div>
    <div class="card">
      <h3><a href="/p/3/">Track Spike</a></h3>
      <p>Stiff plate, sharp pins.</p>
      <footer><span>$95</span></footer>
    </div>
    <div class="card">
      <h3><a href="/p/4/">Walking Shoe</a></h3>
      <p>Wide toe box.</p>
      <footer><span>$85</span></footer>
    </div>
  </div>
</body>
</html>
