<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture: Sensitive Values</title></head>
<body>
  <main>
    <h1>Checkout</h1>
    <!-- Every value here is a distinct sentinel. A snapshot that serializes any
         of them has violated specification 7.2, and the test names which one. -->
    <form id="checkout" action="/pay" method="post">
      <label for="cardholder">Cardholder</label>
      <input type="text" id="cardholder" name="cardholder" value="PUBLIC-CARDHOLDER-OK">

      <label for="card">Card number</label>
      <input type="text" id="card" name="card_number" autocomplete="cc-number" value="SENTINEL-CARD-4111">

      <label for="cvc">Security code</label>
      <input type="text" id="cvc" name="cvc" autocomplete="cc-csc" value="SENTINEL-CVC-737">

      <label for="pw">Password</label>
      <input type="password" id="pw" name="password" value="SENTINEL-PASSWORD-HUNTER2">

      <label for="doc">Identity document</label>
      <input type="file" id="doc" name="identity_document">

      <input type="hidden" name="csrf_token" value="SENTINEL-CSRF-TOKEN">
      <input type="hidden" name="session_id" value="SENTINEL-SESSION-ID">

      <button type="submit">Pay</button>
    
    <!-- Payment fields whose names the first denylist did not recognise. Every one
         of these had its value collected until the counter-review found them. -->
    <fieldset>
      <legend>Card details the old rules missed</legend>
      <label for="pan">Card number</label>
      <input type="text" id="pan" name="pan" value="SENTINEL-PAN-4111111111111111">

      <label for="security_code">Security code</label>
      <input type="text" id="security_code" name="security_code" value="SENTINEL-CSC-737">

      <label for="cc_num">Card</label>
      <input type="text" id="cc_num" name="cc_num" value="SENTINEL-CCNUM">

      <label for="creditcard">Credit card</label>
      <input type="text" id="creditcard" name="creditcard" value="SENTINEL-CREDITCARD">

      <label for="holder">Name on card</label>
      <input type="text" id="holder" name="holder" autocomplete="cc-given-name"
             value="SENTINEL-CC-GIVEN-NAME">

      <label for="q1">Card number</label>
      <input type="text" id="q1" name="q1" aria-label="card number" value="SENTINEL-BY-LABEL">
    </fieldset>
</form>
  </main>
</body>
</html>
